name: Apollo Windows
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/apollo-windows.yml
      - CMakeLists.txt
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - NOTICE
      - cmake/**
      - src/**
      - src_assets/**
      - packaging/**
      - dashboard/**
      - tests/**
      - tools/**
      - '!dashboard/**/*.md'
permissions:
  contents: read
jobs:
  gamepad:
    if: github.repository == 'matheuspergoli/Apollo'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout pinned gamepad client
        run: git submodule update --init third-party/ViGEmClient
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-toolchain
      - name: Compile isolated gamepad probe
        shell: msys2 {0}
        run: g++ -std=c++17 -static -pthread -I third-party/ViGEmClient/include tools/tests/test_vigem_live.cpp third-party/ViGEmClient/src/ViGEmClient.cpp -o vigem-live-test.exe -lsetupapi -lcfgmgr32 -lxinput1_4
      - name: Qualify vendor bus and XInput before the full native build
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vendor-gamepad-inputs'
          New-Item -ItemType Directory -Path "$root/scripts", "$root/drivers/sudovda" -Force | Out-Null
          Copy-Item packaging/windows/runtime-contract.json "$root/drivers/sudovda/runtime-contract.json"
          Invoke-WebRequest 'https://github.com/nefarius/ViGEmBus/releases/download/v1.21.442.0/ViGEmBus_1.21.442_x64_x86_arm64.exe' -OutFile "$root/scripts/vigembus_installer.exe"
          & ./tools/tests/prepare_vigem_runner.ps1 -Candidate $root -Probe ./vigem-live-test.exe
  windows:
    needs: gamepad
    if: github.repository == 'matheuspergoli/Apollo'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository metadata and tooling policy
        run: python -m unittest discover -s tools/release -p 'test_*.py'
      - name: Checkout native dependencies
        shell: bash
        run: >-
          git submodule update --init --recursive
          third-party/build-deps third-party/libdisplaydevice third-party/googletest
          third-party/nanors third-party/nv-codec-headers
          third-party/nvapi-open-source-sdk third-party/Simple-Web-Server
          third-party/tray third-party/ViGEmClient third-party/moonlight-common-c
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-nlohmann_json
      - name: Clock regression checks
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . tools/tests/test_clock.cpp -o clock-test.exe
          ./clock-test.exe
      - name: Driver policy and data preservation regressions
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/tests/test_driver_policy.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/tests/test_installation_data.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build isolated live-driver test
        shell: msys2 {0}
        run: g++ -std=c++23 -static -static-libgcc -static-libstdc++ -pthread -I . tools/tests/test_sudovda_live.cpp -o driver-live-test.exe -lsetupapi -lcfgmgr32 -lole32
      - name: Build isolated virtual gamepad lifecycle probe
        shell: msys2 {0}
        run: g++ -std=c++17 -static -pthread -I third-party/ViGEmClient/include tools/tests/test_vigem_live.cpp third-party/ViGEmClient/src/ViGEmClient.cpp -o vigem-live-test.exe -lsetupapi -lcfgmgr32 -lxinput1_4
      - name: Configure native host and contracts
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          git diff --ignore-cr-at-eol --quiet --ignore-submodules=all
          export BUILD_VERSION="$(node -p "require('./dashboard/package.json').version")"
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF -DBUILD_TESTS=OFF -DBUILD_UI_CONTRACT_TESTS=ON
      - name: Compile lifecycle HTTP boundary first
        shell: msys2 {0}
        run: cmake --build build-windows --target CMakeFiles/sunshine.dir/src/confighttp.cpp.obj
      - name: Build complete native host and React assets
        shell: msys2 {0}
        run: cmake --build build-windows --parallel 4
      - name: Native configuration/UI contract tests
        shell: msys2 {0}
        run: |
          cd build-windows/tests/ui-contracts
          ./apollo_ui_contracts.exe
      - name: Direct update helper integration before packaging
        run: pwsh -NoProfile -NonInteractive -File tools/tests/test_update_helper.ps1 -HostExecutable build-windows/sunshine.exe
      - name: Package Windows ZIP and installer
        shell: msys2 {0}
        run: |
          cd build-windows
          strip --strip-unneeded sunshine.exe
          stage="$(mktemp -d "$PWD/install-manifest.XXXXXX")"
          cmake --install . --prefix "$stage"
          python ../tools/release/create-install-manifest.py "$stage" "$PWD/installation-manifest.json"
          cpack -G ZIP --config CPackConfig.cmake
          cpack -G NSIS --config CPackConfig.cmake
          git rev-parse HEAD > SOURCE_COMMIT.txt
          sha256sum cpack_artifacts/*.zip cpack_artifacts/*.exe > SHA256SUMS.txt
      - name: Install browser for isolated native integration
        working-directory: dashboard
        run: pnpm exec playwright install chromium
      - name: Audit React package and preserved assets without installation
        run: |
          python tools/release/audit-dashboard-package.py build-windows/cpack_artifacts/Apollo.zip
          python tools/release/audit-windows-installer.py build-windows/cpack_artifacts/Apollo.exe build-windows/cpack_artifacts/Apollo.zip
      - name: Real installer, upgrade, service restart and live driver qualification
        run: pwsh -NoProfile -NonInteractive -File tools/tests/test_windows_installer.ps1 -Archive build-windows/cpack_artifacts/Apollo.zip -Installer build-windows/cpack_artifacts/Apollo.exe -DriverTest ./driver-live-test.exe
      - name: Native HTTPS and React integration on the isolated runner
        working-directory: dashboard
        run: node scripts/check-native-windows.mjs ../build-windows/cpack_artifacts/Apollo.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-windows-release
          path: |
            build-windows/cpack_artifacts/*.zip
            build-windows/cpack_artifacts/*.exe
            build-windows/SOURCE_COMMIT.txt
            build-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: apollo-windows-diagnostics
          path: |
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/cpack_artifacts/Apollo.zip
            build-windows/cpack_artifacts/Apollo.exe
            build-windows/CMakeCache.txt
            dashboard/native-test.log
            dashboard/native-browser-diagnostics.json
            dashboard/native-browser-failure.png
            dashboard/native-browser-failure.html
            installer-test.log
            build-windows/cpack_artifacts/_CPack_Packages/**/project.nsi
            build-windows/CPackConfig.cmake
          if-no-files-found: ignore
          retention-days: 7
