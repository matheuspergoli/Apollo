name: Vendor extraction diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    if: github.repository == 'matheuspergoli/Apollo'
    runs-on: windows-2022
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        syntax: [space, colon]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Extract checksum-pinned vendor package without installing
        env:
          EXTRACTION_SYNTAX: ${{ matrix.syntax }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vendor-extraction'
          New-Item -ItemType Directory -Path $root | Out-Null
          $exe = Join-Path $root 'ViGEmBus_1.21.442_x64_x86_arm64.exe'
          Invoke-WebRequest 'https://github.com/nefarius/ViGEmBus/releases/download/v1.21.442.0/ViGEmBus_1.21.442_x64_x86_arm64.exe' -OutFile $exe
          $contract = Get-Content packaging/windows/runtime-contract.json -Raw | ConvertFrom-Json
          $expected = $contract.sha256.PSObject.Properties['scripts/vigembus_installer.exe'].Value
          if ((Get-FileHash $exe).Hash -ine $expected) { throw 'Vendor hash mismatch.' }
          $output = Join-Path $root 'payload'
          $log = Join-Path $root 'bootstrapper.log'
          $arguments = if ($env:EXTRACTION_SYNTAX -eq 'space') { '/extract "' + $output + '"' } else { '/extract:"' + $output + '"' }
          $arguments += ' /exelog "' + $log + '"'
          Write-Output "Extraction arguments: $arguments"
          $process = Start-Process $exe -ArgumentList $arguments -WorkingDirectory $root -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Extraction timeout.' }
          Write-Output "Bootstrapper exit: $($process.ExitCode)"
          Start-Sleep -Seconds 10
          if (Test-Path $log) { Get-Content $log }
          Get-ChildItem $root -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          $files = @(Get-ChildItem $root -Recurse -File -Filter 'ViGEmBus.inf')
          if (-not $files.Count) { throw 'No extracted INF; no installation or device operation was attempted.' }
          Write-Output 'Vendor extraction produced driver inputs; no driver was installed.'
