name: Apollo Windows
on:
  workflow_dispatch:
  push:
    branches: [ui/react-migration]
    paths:
      - .github/workflows/apollo-windows.yml
      - cmake/**
      - src/**
      - dashboard/**
      - tests/**
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'matheuspergoli/Apollo'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout native dependencies
        shell: bash
        run: >-
          git submodule update --init --recursive
          third-party/build-deps third-party/libdisplaydevice third-party/googletest
          third-party/nanors third-party/nv-codec-headers
          third-party/nvapi-open-source-sdk third-party/Simple-Web-Server
          third-party/tray third-party/ViGEmClient third-party/moonlight-common-c
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-nlohmann_json
      - name: Clock regression checks
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I . tools/tests/test_clock.cpp -o clock-test.exe
          ./clock-test.exe
      - name: Configure native host and contracts
        shell: msys2 {0}
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF -DBUILD_TESTS=OFF -DBUILD_UI_CONTRACT_TESTS=ON
      - name: Build native host and React assets
        shell: msys2 {0}
        run: cmake --build build-windows --parallel 4
      - name: Native configuration/UI contract tests
        shell: msys2 {0}
        run: |
          cd build-windows/tests/ui-contracts
          ./apollo_ui_contracts.exe
      - name: Package for validation
        shell: msys2 {0}
        run: |
          cd build-windows
          cpack -G ZIP --config CPackConfig.cmake
          git rev-parse HEAD > SOURCE_COMMIT.txt
          sha256sum cpack_artifacts/*.zip > SHA256SUMS.txt
      - name: Install browser for isolated native integration
        working-directory: dashboard
        run: npm exec playwright install -- chromium
      - name: Native HTTPS and React integration on the isolated runner
        working-directory: dashboard
        run: node scripts/check-native-windows.mjs ../build-windows/cpack_artifacts/Apollo.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-windows-validation
          path: |
            build-windows/cpack_artifacts/*.zip
            build-windows/SOURCE_COMMIT.txt
            build-windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: apollo-windows-diagnostics
          path: |
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/CMakeCache.txt
            dashboard/native-test.log
          if-no-files-found: ignore
          retention-days: 7
